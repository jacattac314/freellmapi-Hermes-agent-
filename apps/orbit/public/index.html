<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit — live satellites &amp; space weather</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
  <script src="/vendor/topojson-client/dist/topojson-client.min.js"></script>
</head>
<body>
  <div id="scene"></div>

  <div id="demo-banner" hidden>DEMO DATA — synthetic, not real observations</div>

  <header id="topbar">
    <div class="brand">Orbit</div>
    <div id="clock" class="mono"></div>
    <div id="sat-count" class="muted"></div>
  </header>

  <!-- Left: filters + search -->
  <aside id="left" class="panel">
    <section>
      <h3>Find</h3>
      <input id="search" type="search" placeholder="ISS, Starlink-1007, GPS…" autocomplete="off" />
      <ul id="search-results"></ul>
    </section>
    <section>
      <h3>Orbit regime</h3>
      <label><input type="checkbox" data-regime="LEO" checked /> <span class="sw" style="--c:var(--leo)"></span>Low Earth (LEO)</label>
      <label><input type="checkbox" data-regime="MEO" checked /> <span class="sw" style="--c:var(--meo)"></span>Medium (MEO)</label>
      <label><input type="checkbox" data-regime="GEO" checked /> <span class="sw" style="--c:var(--geo)"></span>Geostationary (GEO)</label>
      <label><input type="checkbox" data-regime="HEO" checked /> <span class="sw" style="--c:var(--heo)"></span>Highly elliptical</label>
    </section>
    <section>
      <h3>Constellations</h3>
      <label><input type="checkbox" data-group="starlink" checked /> Starlink</label>
      <label><input type="checkbox" data-group="oneweb" checked /> OneWeb</label>
      <label><input type="checkbox" data-group="gnss" checked /> Navigation (GPS, Galileo…)</label>
      <label><input type="checkbox" data-group="station" checked /> Crewed stations</label>
      <label><input type="checkbox" data-group="other" checked /> Everything else</label>
    </section>
    <section>
      <h3>Layers</h3>
      <label><input type="checkbox" id="layer-aurora" checked /> Aurora forecast</label>
      <label><input type="checkbox" id="layer-rings" checked /> GEO ring</label>
      <label><input type="checkbox" id="layer-labels" checked /> Labels</label>
    </section>
  </aside>

  <!-- Right: space weather + ISS telemetry + selection -->
  <aside id="right" class="panel">
    <section id="selection" hidden>
      <h3 id="sel-name"></h3>
      <dl id="sel-body"></dl>
      <div class="row">
        <button id="sel-follow">Follow</button>
        <button id="sel-clear">Close</button>
      </div>
    </section>
    <section>
      <h3>Space weather <span class="hint">NOAA SWPC</span></h3>
      <dl id="wx"></dl>
    </section>
    <section>
      <h3>ISS live telemetry <span class="hint">NASA ISSLive</span></h3>
      <div id="iss-signal" class="muted">connecting…</div>
      <dl id="iss-tm"></dl>
    </section>
    <section>
      <h3>Data freshness</h3>
      <dl id="freshness"></dl>
    </section>
  </aside>

  <!-- Bottom: scale slider -->
  <footer id="scale" class="panel">
    <div id="scale-title"></div>
    <input id="scale-slider" type="range" min="0" max="5" step="0.001" value="1" aria-label="View scale" />
    <div id="scale-ticks"></div>
    <div id="scale-desc" class="muted"></div>
  </footer>

  <div id="tooltip" hidden></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
